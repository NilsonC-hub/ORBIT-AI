    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--sans);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}a{color:inherit}a:focus-visible{outline:3px solid var(--teal);outline-offset:7px}img{max-width:100%}.masthead{background:var(--navy);color:var(--paper);border-bottom:5px solid var(--yellow)}.masthead-inner{max-width:1320px;margin:auto;padding:22px 46px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{display:block;width:206px;height:auto}.edition{font:600 12px/1.7 var(--mono);letter-spacing:.13em;text-align:right}.edition span{display:block;color:var(--cyan);font-family:var(--sans);letter-spacing:.14em;font-size:13px}.page{max-width:1320px;margin:auto;padding:0 46px}.hero{padding:48px 0 40px;border-bottom:2px solid var(--ink)}.back-link{display:inline-block;font-size:14px;text-decoration-thickness:1px;text-underline-offset:5px}.hero h1{margin:34px 0 0;font-size:clamp(42px,4.6vw,65px);font-weight:850;letter-spacing:-.06em;line-height:1.23}.hero h1::after{content:"";display:block;margin-top:27px;width:72px;height:7px;background:var(--yellow)}.works{padding:32px 0 54px}.work{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:34px 36px;text-decoration:none;border:1.5px solid var(--ink);background:var(--paper);box-shadow:5px 5px 0 #08273317;transition:transform .2s ease,box-shadow .2s ease}.work:hover{transform:translateY(-4px);box-shadow:7px 10px 0 #08273320}.work:active{transform:translateY(0)}.work time{font:700 13px/1.5 var(--mono);color:var(--teal);letter-spacing:.08em}.work h2{font-size:clamp(27px,3vw,38px);letter-spacing:-.035em;line-height:1.3;margin:14px 0 0;font-weight:800}.work-open{display:flex;align-items:center;gap:16px;flex-shrink:0;font-size:14px;font-weight:700}.work-arrow{display:grid;place-items:center;width:36px;height:36px;border-radius:50%     @media(max-width:760px){.masthead-inner{padding:19px 24px}.logo{width:164px}.edition{font-size:9px}.edition span{font-size:11px}.page{padding:0 24px}.hero{padding:30px 0}.hero h1{font-size:42px;margin-top:29px;letter-spacing:-.05em}.hero h1::after{margin-top:20px;width:55px;height:6px}.works{padding:26px 0 35px}.work{display:block;padding:25px 23px}.work h2{font-size:30px}.work-open{justify-content:space-between;border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.footer{padding:22px 0 30px}}@media(max-width:350px){.page{padding:0 18px}.masthead-inner{padding:17px 18px}.logo{width:145px}.edition{letter-spacing:.08em}.hero h1{font-size:36px}.work{padding:22px 20px}.work h2{font-size:27px}}@media(prefers-reduced-motion:reduce){.work{transition:none}}
