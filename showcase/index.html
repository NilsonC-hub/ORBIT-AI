<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#082f39">
  <meta name="description" content="ORBIT AI 学生作品。">
  <title>学生作品 · ORBIT AI</title>
  <style>
    :root{--ink:#082733;--muted:#486168;--paper:#f6f7f1;--navy:#082f39;--teal:#008e76;--cyan:#78d8e5;--yellow:#ffc94d;--coral:#f26b5e;--paper-warm:#fff7d7;--teal-soft:#d9f2ed;--line:rgba(8,39,51,.12);--sans:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif;--mono:"Cascadia Mono","SFMono-Regular",Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--sans);background-color:var(--paper);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px}a{color:inherit}a:focus-visible{outline:3px solid var(--teal);outline-offset:7px}img{max-width:100%}.masthead{background:var(--navy);color:var(--paper);border-bottom:5px solid var(--yellow)}.masthead-inner{max-width:1320px;margin:auto;padding:22px 46px;display:flex;align-items:center;justify-content:space-between;gap:24px}.logo{display:block;width:206px;height:auto}.edition{font:600 12px/1.7 var(--mono);letter-spacing:.13em;text-align:right}.edition span{display:block;color:var(--cyan);font-family:var(--sans);letter-spacing:.14em;font-size:13px}.page{max-width:1320px;margin:auto;padding:0 46px}.hero{padding:48px 0 40px;border-bottom:2px solid var(--ink)}.back-link{display:inline-block;font-size:14px;text-decoration-thickness:1px;text-underline-offset:5px}.hero h1{margin:34px 0 0;font-size:clamp(42px,4.6vw,65px);font-weight:850;letter-spacing:-.06em;line-height:1.23}.hero h1::after{content:"";display:block;margin-top:27px;width:72px;height:7px;background:var(--yellow)}.works{padding:32px 0 54px}.work{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr);align-items:center;gap:28px 32px;padding:32px 34px;text-decoration:none;border:2px solid var(--ink);border-radius:24px;background:var(--paper);box-shadow:7px 8px 0 #08273317;transition:transform .2s ease,box-shadow .2s ease}.work:hover{transform:translateY(-4px);box-shadow:7px 10px 0 #08273320}.work:active{transform:translateY(0)}.work-cover{position:relative;width:100%;overflow:hidden;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--cyan)}.work-thumbnail{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}.work-tags{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;right:12px}.work-tags span{background:var(--cyan);border:1.5px solid var(--ink);border-radius:7px;padding:5px 8px;color:var(--ink);font-size:11px;font-weight:700;line-height:1.2;box-shadow:2px 2px 0 rgba(8,39,51,.25)}.work-tags .language{font-family:var(--mono);background:var(--yellow)}.work-content{flex:1;min-width:0}.work time{font:700 13px/1.5 var(--mono);color:var(--teal);letter-spacing:.08em}.work h2{font-size:clamp(27px,3vw,38px);letter-spacing:-.035em;line-height:1.3;margin:14px 0 0;font-weight:800}.work-open{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:0;padding-top:18px;border-top:1px solid var(--line);font-size:14px;font-weight:700}.work-arrow{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;background:var(--yellow);font-size:24px;line-height:1;box-shadow:2px 2px 0 var(--coral)}.footer{border-top:1px solid var(--line);padding:25px 0 32px;color:var(--muted);font-size:11px;line-height:1.7}.footer p{margin:0;color:var(--ink);font-family:var(--mono);font-weight:700;letter-spacing:.1em}
    @media(max-width:760px){.masthead-inner{padding:19px 24px}.logo{width:164px}.edition{font-size:9px}.edition span{font-size:11px}.page{padding:0 24px}.hero{padding:30px 0}.hero h1{font-size:42px;margin-top:29px;letter-spacing:-.05em}.hero h1::after{margin-top:20px;width:55px;height:6px}.works{padding:26px 0 35px}.work{display:block;padding:25px 23px}.work-cover{width:100%;margin-bottom:25px}.work h2{font-size:30px}.work-open{justify-content:space-between;border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.footer{padding:22px 0 30px}}@media(max-width:350px){.page{padding:0 18px}.masthead-inner{padding:17px 18px}.logo{width:145px}.edition{letter-spacing:.08em}.hero h1{font-size:36px}.work{padding:22px 20px}.work h2{font-size:27px}}@media(prefers-reduced-motion:reduce){.work{transition:none}}
    body{user-select:none;-webkit-user-select:none}.work-authors{margin:16px 0 0;color:var(--muted);font-size:14px;line-height:1.8}.work-authors span{white-space:nowrap}
    .work-description{margin:12px 0 0;color:var(--muted);font-size:15px;line-height:1.8}
    .work-review{grid-column:1/-1;padding:20px 24px;background:var(--paper-warm);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--teal-soft)}
    .work-review-title{display:inline-block;margin:0 0 12px;padding:5px 11px;background:var(--coral);border:1.5px solid var(--ink);border-radius:7px;color:var(--ink);font-size:13px;line-height:1.4;font-weight:800;transform:rotate(-2deg)}
    .work-review-text{margin:0;color:var(--ink);font-size:15px;line-height:1.85}
    @media(max-width:760px){.work-review{margin-top:24px;padding:18px}.work-description,.work-review-text{font-size:15px}.work-open{margin-top:24px}}
  </style>
</head>
<body>
  <header class="masthead"><div class="masthead-inner"><img class="logo" src="../assets/brand/orbit-ai-logo.svg" alt="ORBIT AI"><div class="edition">STUDENT WORKS<span>学生作品</span></div></div></header>
  <main class="page">
    <header class="hero"><a class="back-link" href="../semester-01/">返回课程目录</a><h1>学生作品</h1></header>
    <section class="works" aria-label="作品列表">
      <a class="work" href="2026-09-18-frog-life/" aria-label="打开作品：青蛙的一生，2026年9月18日，JavaScript 交互动画" aria-describedby="frog-description frog-authors frog-review-text">
        <div class="work-cover">
          <img class="work-thumbnail" src="2026-09-18-frog-life/thumbnail.jpg" width="384" height="216" alt="" decoding="async">
          <div class="work-tags"><span class="language">JavaScript</span><span>交互动画</span></div>
        </div>
        <div class="work-content">
          <time datetime="2026-09-18">2026-09-18</time>
          <h2>青蛙的一生</h2>
          <p class="work-description" id="frog-description">通过动画与简单互动，观察青蛙从蛙卵、蝌蚪到成蛙的成长过程。</p>
          <p class="work-authors" id="frog-authors"><span>陈艺菡</span> / <span>柯忻妤</span> / <span>庄胤亨</span> / <span>彭森</span></p>
        </div>
        <div class="work-review">
          <h3 class="work-review-title">老师点评</h3>
          <p class="work-review-text" id="frog-review-text">第一次尝试让 AI 用代码把《青蛙的一生》变成动画。AI 不是魔法棒，所以作品一定会有瑕疵，不过创意与探索值得肯定，也拓展了 AI 使用的新方式。</p>
        </div>
        <div class="work-open"><span>打开作品</span><span class="work-arrow" aria-hidden="true">↗</span></div>
      </a>
    </section>
    <footer class="footer"><p>ORBIT AI</p></footer>
  </main>
  <script>['copy','cut'].forEach(function(type){document.addEventListener(type,function(e){e.preventDefault();});});</script>
</body>
</html>
